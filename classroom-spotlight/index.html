<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classroom Spotlight</title><style>
@font-face{font-family:Moong;src:local("TDTDCuteDoggy"),local("TDTD귀욤둥이");font-display:swap}*{box-sizing:border-box}body{margin:0;background:#f3f5fc;color:#26334b;font-family:Moong,'Malgun Gothic','Apple SD Gothic Neo',sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;border-radius:16px;padding:12px 20px;font-weight:800;color:#26334b;background:#e6eafa}button:hover{filter:brightness(.96)}button:focus-visible{outline:4px solid #ef9e37}header{display:flex;align-items:center;gap:6px;padding:2vh 3vw}header h1{font-size:clamp(22px,2.6vw,44px);margin:0 auto 0 0;letter-spacing:-1px}header button{font-size:clamp(14px,1.5vw,25px);padding:10px 12px}.active,.primary{background:#5267d9;color:white}main{height:calc(100dvh - 11vh);padding:0 3vw 2vh;display:flex;flex-direction:column;gap:1.5vh}.stage{flex:1;min-height:0;background:white;border-radius:30px;box-shadow:0 8px 0 #e4e8f3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:2vh 3vw}.eyebrow{font-size:clamp(22px,3vw,48px);color:#6577ba;font-weight:900}.hero{font-size:clamp(65px,15vw,240px);line-height:1.2;font-weight:900;letter-spacing:-.04em;margin:1vh 0;word-break:keep-all}.sub{font-size:clamp(20px,3.3vw,55px);font-weight:800;color:#53627c;white-space:pre-wrap}.toolbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.toolbar button{font-size:clamp(18px,2.2vw,36px);padding:1.5vh 2vw}.mint{background:#d7f4e8;color:#17674e}.yellow{background:#ffe7a5;color:#775313}.pink{background:#ffe2e8;color:#913b57}.seats{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:10px;width:100%;flex:1;min-height:0}.seat{font-size:clamp(16px,3.2vw,52px);padding:0;min-width:0;background:#e8edff;white-space:nowrap}.seat.done{background:#d9f2e6;color:#376e5a}.seat.empty{background:#f1f2f5;visibility:hidden}.boardline{width:100%;background:#dce4fa;border-radius:12px;padding:7px;font-size:clamp(16px,1.7vw,28px);margin-top:12px}.boardtext{font-weight:900;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.22;width:100%;overflow:auto}.pop{animation:pop .45s cubic-bezier(.2,.8,.3,1.4)}@keyframes pop{from{transform:scale(.75);opacity:.35}to{transform:scale(1);opacity:1}}dialog{border:0;border-radius:24px;padding:24px;width:min(880px,94vw);max-height:92vh;overflow:auto;color:#26334b;box-shadow:0 20px 80px #24304b55}dialog::backdrop{background:#26334b77}dialog h2{margin-top:0}textarea{width:100%;border:2px solid #dce1ed;border-radius:12px;padding:12px;font-size:20px}label{display:block;margin:12px 0 6px;font-weight:bold}.settingsrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input[type=range]{width:100%}.small{font-size:14px;color:#667085}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button{font-size:18px}.hidden{display:none!important}body.clean header,body.clean .toolbar{display:none}body.clean main{height:100dvh;padding:1.5vh}body.clean .stage{box-shadow:none}.corner{position:fixed;right:12px;bottom:12px;opacity:.25;font-size:14px;z-index:3}.corner:hover{opacity:1}
.volunteer .hero{font-size:clamp(48px,11vw,180px);color:#3449a4}.volunteer .eyebrow{color:#6577ba}.volunteer .sub{color:#53627c}
#whiteboard{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;color:#202020}#whiteboard textarea{flex:1;min-height:0;width:100%;resize:none;border:0;border-radius:0;outline:none;padding:5vh 5vw;background:white;color:#202020;font-size:8vw;line-height:1.3;font-weight:normal;box-shadow:none}#whiteboard .wbtools{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:8px 16px;background:white}#whiteboard .wbtools button{font-size:clamp(14px,1.4vw,23px);padding:6px 12px;background:#f3f3f3}#whiteboard .wbtools span{font-size:16px;color:#777}#whiteboard .wbtools{opacity:.32}#whiteboard .wbtools:hover,#whiteboard .wbtools:focus-within{opacity:1}
</style></head><body><header><h1>✦ Classroom Spotlight</h1><button data-c="0">5-1</button><button data-c="1">5-2</button><button data-c="2">5-3</button><button data-c="3">6-1</button><button data-c="4">6-2</button><button data-c="5">6-3</button><button id="full">⛶</button><button id="settings">⚙</button></header><main><section class="stage" id="stage"><div id="spot"><div class="eyebrow" id="eyebrow">Who's next?</div><div class="hero" id="hero">Ready?</div><div class="sub" id="sub">발표할 친구를 뽑아 볼까요?</div></div><div id="seatview" class="hidden" style="width:100%;height:100%;display:flex;flex-direction:column"><div class="seats" id="seats"></div><div class="boardline">칠판</div></div><div class="boardtext hidden" id="boardtext"></div></section><div class="toolbar"><button class="primary" id="random">🎲 랜덤 뽑기</button><button class="mint" id="direct">발표할 사람~?</button><button class="mint hidden" id="choose">이름 선택</button><button class="yellow" id="write">큰 글씨 판서</button><button class="yellow" id="finished">다 했니~?</button><button class="pink" id="praise">잘했어요!</button><button id="clean">화면만 보기</button></div></main><button class="corner hidden" id="exitclean">화면 나가기 (Esc)</button>
<section id="whiteboard" class="hidden" aria-label="큰 글씨 판서"><textarea id="wbinput" aria-label="판서 내용" spellcheck="false"></textarea><div class="wbtools"><span id="wbsize">8</span><button id="wbminus" aria-label="글씨 작게">가−</button><button id="wbplus" aria-label="글씨 크게">가+</button><button id="wbclear">지우기</button><button id="wbexit">닫기 (Esc)</button></div></section><dialog id="editor"><h2>큰 글씨 판서</h2><textarea id="message" rows="4" placeholder="TV에 보여 줄 문장을 입력하세요."></textarea><label>글씨 크기</label><input id="size" type="range" min="3" max="15" step="0.5" value="8"><div class="quick" id="quick"></div><div class="settingsrow"><button class="primary" id="showboard">화면에 띄우기</button><button id="closeeditor">닫기</button></div></dialog>
<dialog id="prefs"><h2>교사용 설정</h2><label>기존 프로그램 가져오기 (최초 1회)</label><input type="file" id="importOld" accept=".html"><div class="small">기존 Classroom_Picker_Whiteboard.html 파일을 선택하세요. 인터넷에 전송하지 않습니다.</div><label>6학년 자리배치 파일 가져오기</label><input type="file" id="importGrade6" accept=".json"><div class="small">Grade6_Rosters.json을 선택하면 6학년 세 반만 저장됩니다.</div><label>명단 수정 (한 줄에 6자리, 쉼표 구분 / 빈자리는 -)</label><textarea id="roster" rows="5"></textarea><div class="settingsrow"><button id="save" class="primary">명단 저장</button><button id="reset">현재 반 발표 기록 초기화</button></div><label><input type="checkbox" id="unique" checked> 랜덤 뽑기에서 이미 발표한 학생 제외</label><label><input type="checkbox" id="sound" checked> 짧은 효과음</label><label>발표 화면 핵심 표현</label><textarea id="phrase" rows="2">It's your turn!</textarea><label>글꼴 직접 적용 (TTF / OTF / WOFF / WOFF2)</label><input type="file" id="font" accept=".ttf,.otf,.woff,.woff2"><div class="small" id="fontstatus">기존 HTML을 가져오면 명단과 글꼴이 이 브라우저에만 저장됩니다.</div><label><input type="checkbox" id="mirror" checked> 교사 시점 (칠판 아래)</label><div class="settingsrow"><button id="closeprefs">닫기</button></div></dialog>
<script>
const defaults=Array.from({length:6},()=>Array(24).fill('-'));
const $=id=>document.getElementById(id);let rosters=defaults;try{const saved=JSON.parse(localStorage.getItem('spot-rosters'));if(Array.isArray(saved))rosters=defaults.map((row,i)=>Array.isArray(saved[i])&&saved[i].length===24?saved[i]:row)}catch{}let cls=0,used=Array.from({length:6},()=>new Set()),busy=false,timer=null,mode='spot';const buttons=[...document.querySelectorAll('[data-c]')];function view(m){mode=m;$('spot').classList.remove('volunteer');$('choose').classList.add('hidden');for(const [id,n] of [['spot','spot'],['seatview','seats'],['boardtext','board']])$(id).classList.toggle('hidden',m!==n)}function stop(){clearInterval(timer);busy=false;$('random').disabled=false}function updateClass(){stop();buttons.forEach((b,i)=>b.classList.toggle('active',i===cls));ready()}function ready(){view('spot');$('eyebrow').textContent="Who's next?";$('hero').textContent='Ready?';$('sub').textContent='발표할 친구를 뽑아 볼까요?'}function pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}function tone(good=true){if(!$('sound').checked)return;try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();[523,659,784].slice(0,good?3:1).forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.09;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.075,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.24)});setTimeout(()=>c.close(),600)}catch{}}function pick(name){stop();used[cls].add(name);view('spot');$('eyebrow').textContent='Your turn!';$('hero').textContent=name;$('sub').textContent=$('phrase').value;pop($('hero'));tone()}function seats(){stop();view('seats');$('seats').replaceChildren();let names=rosters[cls].slice();$('seatview').style.flexDirection=$('mirror').checked?'column':'column-reverse';$('seatview').querySelector('.boardline').style.margin=$('mirror').checked?'12px 0 0':'0 0 12px';if($('mirror').checked){names.reverse()}names.forEach(n=>{const b=document.createElement('button');b.className='seat'+(n==='-'?' empty':used[cls].has(n)?' done':'');b.textContent=n;b.disabled=n==='-';b.onclick=()=>pick(n);$('seats').append(b)})}buttons.forEach((b,i)=>b.onclick=()=>{cls=i;updateClass()});function volunteer(){stop();view('spot');$('spot').classList.add('volunteer');$('eyebrow').textContent='Who wants to share?';$('hero').textContent='발표할 사람~?';$('sub').textContent='손을 들어 주세요!';$('choose').classList.remove('hidden');pop($('hero'))} $('direct').onclick=volunteer;$('choose').onclick=seats;$('random').onclick=()=>{if(busy)return;let all=rosters[cls].filter(n=>n&&n!=='-'),pool=all.filter(n=>!$('unique').checked||!used[cls].has(n));if(!all.length){alert('교사용 설정에서 기존 프로그램을 가져오거나 명단을 입력하세요.');return}if(!pool.length){view('spot');$('eyebrow').textContent='Everyone had a turn!';$('hero').textContent='완료!';$('sub').textContent='모두 발표했어요.';return}view('spot');busy=true;$('random').disabled=true;$('eyebrow').textContent="Who's next?";$('sub').textContent='두구두구…';let i=0;timer=setInterval(()=>{$('hero').textContent=pool[Math.floor(Math.random()*pool.length)];if(++i>=12)pick(pool[Math.floor(Math.random()*pool.length)])},75)};
function board(text){stop();view('board');$('boardtext').textContent=text;$('boardtext').style.fontSize=$('size').value+'vw';pop($('boardtext'))} $('praise').onclick=()=>{stop();view('spot');$('eyebrow').textContent='Great job!';$('hero').textContent='잘했어요!';$('sub').textContent='Wonderful!';pop($('hero'));tone()};$('finished').onclick=()=>{stop();view('spot');$('eyebrow').textContent='Are you done?';$('hero').textContent='다 했니~?';$('sub').textContent='';pop($('hero'));};let wbSize=8;function wbClose(){$('whiteboard').classList.add('hidden');$('write').focus()}function wbResize(delta){wbSize=Math.max(2,Math.min(18,wbSize+delta));$('wbinput').style.fontSize=wbSize+'vw';$('wbsize').textContent=wbSize;$('wbinput').focus()}$('write').onclick=()=>{stop();$('whiteboard').classList.remove('hidden');$('wbinput').focus()};$('wbexit').onclick=wbClose;$('wbclear').onclick=()=>{$('wbinput').value='';$('wbinput').focus()};$('wbminus').onclick=()=>wbResize(-1);$('wbplus').onclick=()=>wbResize(1);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('whiteboard').classList.contains('hidden')){e.preventDefault();e.stopImmediatePropagation();wbClose()}},true);$('showboard').onclick=()=>{board($('message').value);$('editor').close()};$('closeeditor').onclick=()=>$('editor').close();$('size').oninput=()=>{$('boardtext').style.fontSize=$('size').value+'vw'};['책을 펴세요.','조용히 해 주세요.','손을 들어 주세요.','영어로 말해 봅시다.','짝과 연습하세요.','잘 들어 주세요.','Where is the museum?','Go straight and turn right.','You have 1 minute.'].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{$('message').value=t;board(t);$('editor').close()};$('quick').append(b)});$('settings').onclick=()=>{$('roster').value=Array.from({length:4},(_,i)=>rosters[cls].slice(i*6,i*6+6).join(', ')).join('\n');$('prefs').showModal()};$('save').onclick=()=>{let a=$('roster').value.split(/[,\n]/).map(s=>s.trim()||'-');if(a.length!==24){alert('빈자리 포함 24칸을 입력해 주세요.');return}rosters[cls]=a;try{localStorage.setItem('spot-rosters',JSON.stringify(rosters))}catch{};$('prefs').close();seats()};$('reset').onclick=()=>{used[cls].clear();$('prefs').close();ready()};$('closeprefs').onclick=()=>{$('prefs').close();if(mode==='seats')seats()};$('font').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const face=new FontFace('UploadedClassFont',await f.arrayBuffer());await face.load();document.fonts.add(face);document.body.style.fontFamily="UploadedClassFont, Moong, sans-serif";$('fontstatus').textContent=f.name+' 적용 완료 (현재 열린 화면)'}catch{$('fontstatus').textContent='글꼴을 읽지 못했습니다.'}};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};function clean(on){document.body.classList.toggle('clean',on);$('exitclean').classList.toggle('hidden',!on)}$('clean').onclick=()=>clean(true);$('exitclean').onclick=()=>clean(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')clean(false);if(e.target.matches('input,textarea')||document.querySelector('dialog[open]'))return;if(e.key===' '&&e.target===document.body){e.preventDefault();$('random').click()}});updateClass();

async function restoreFont(data){const face=new FontFace('PrivateClassFont','url('+data+')');await face.load();document.fonts.add(face);document.body.style.fontFamily='PrivateClassFont, Moong, sans-serif'}
try{const f=localStorage.getItem('spot-private-font');if(f)restoreFont(f).catch(()=>{});}catch{}
$('importOld').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const raw=await f.text();const m=raw.match(/const defaults=(\[[^\n]*?\]);/);if(!m)throw Error('명단 없음');const a=JSON.parse(m[1].replace(/'/g,'"'));if(!Array.isArray(a)||![3,6].includes(a.length)||!a.every(row=>Array.isArray(row)&&row.length===24&&row.every(x=>typeof x==='string')))throw Error('명단 형식 오류');rosters=defaults.map((row,i)=>a[i]||rosters[i]||row);localStorage.setItem('spot-rosters',JSON.stringify(rosters));used=Array.from({length:6},()=>new Set());const font=raw.match(/data:font\/ttf;base64,[A-Za-z0-9+/=]+/);if(font){localStorage.setItem('spot-private-font',font[0]);await restoreFont(font[0]);}$('prefs').close();seats();alert('세 반 명단과 글꼴을 이 브라우저에 저장했습니다.');}catch(err){alert('가져오기 실패: '+err.message);}};
$('importGrade6').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const a=JSON.parse(await f.text());if(a.grade!==6||!Array.isArray(a.rosters)||a.rosters.length!==3||!a.rosters.every(row=>Array.isArray(row)&&row.length===24&&row.every(n=>typeof n==='string')))throw Error('명단 형식 오류');for(let i=0;i<3;i++){rosters[i+3]=a.rosters[i];used[i+3].clear()}localStorage.setItem('spot-rosters',JSON.stringify(rosters));cls=3;$('prefs').close();updateClass();seats();alert('6학년 세 반 명단 저장 완료!')}catch(err){alert('가져오기 실패: '+err.message)}};
</script></body></html>
